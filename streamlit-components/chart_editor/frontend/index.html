<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: transparent;
        }

        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .chart-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .y-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 12px;
            color: #666;
            margin-right: 5px;
        }

        .chart-area {
            display: flex;
            flex-direction: column;
        }

        #chartCanvas {
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: crosshair;
            background: #fafafa;
        }

        .x-label {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .control-group label {
            font-size: 12px;
            color: #555;
        }

        .control-group input {
            width: 70px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }

        .control-group input:focus {
            outline: none;
            border-color: #4ECDC4;
        }

        .line-selector {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .line-btn {
            padding: 6px 12px;
            border: 2px solid;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .line-btn.active {
            color: white;
        }

        .line-btn:hover {
            opacity: 0.8;
        }

        .add-line-btn {
            padding: 6px 12px;
            border: 2px dashed #999;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            color: #666;
            transition: all 0.2s;
        }

        .add-line-btn:hover {
            border-color: #4ECDC4;
            color: #4ECDC4;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
        }

        .instructions {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
            text-align: center;
        }

        /* Debug toggle button */
        .debug-toggle {
            margin-top: 10px;
            padding: 4px 10px;
            font-size: 11px;
            color: #666;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .debug-toggle:hover {
            background: #e0e0e0;
        }

        .debug-toggle.active {
            background: #4ECDC4;
            color: white;
            border-color: #4ECDC4;
        }

        /* Debug log styles */
        .debug-log {
            margin-top: 15px;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            width: 100%;
            max-width: 700px;
        }

        .debug-log .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #333;
        }

        .debug-log .log-entry:last-child {
            border-bottom: none;
        }

        .debug-log .timestamp {
            color: #888;
        }

        .debug-log .action {
            color: #4ECDC4;
            font-weight: bold;
        }

        .debug-log .data {
            color: #FFEAA7;
        }

        .debug-log .info {
            color: #74b9ff;
        }

        .debug-log .warn {
            color: #fdcb6e;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div class="chart-title" id="chartTitle"></div>
        <div class="chart-wrapper">
            <div class="y-label" id="yLabel"></div>
            <div class="chart-area">
                <canvas id="chartCanvas"></canvas>
                <div class="x-label" id="xLabel"></div>
            </div>
        </div>
        <div class="line-selector" id="lineSelector"></div>
        <div class="controls">
            <div class="control-group">
                <label>X Min:</label>
                <input type="number" id="xMin" step="any">
            </div>
            <div class="control-group">
                <label>X Max:</label>
                <input type="number" id="xMax" step="any">
            </div>
            <div class="control-group">
                <label>Y Min:</label>
                <input type="number" id="yMin" step="any">
            </div>
            <div class="control-group">
                <label>Y Max:</label>
                <input type="number" id="yMax" step="any">
            </div>
        </div>
        <div class="instructions">
            Click to add point | Click point to remove | Drag point to move
        </div>
        <button class="debug-toggle" id="debugToggle" onclick="toggleDebugLog()">Show Debug Log</button>
        <div class="debug-log" id="debugLog" style="display: none;"></div>
    </div>
    <div class="tooltip" id="tooltip" style="display: none;"></div>

    <script>
        // ============================================
        // DEBUG LOG TOGGLE
        // ============================================
        let debugLogVisible = false;

        function toggleDebugLog() {
            debugLogVisible = !debugLogVisible;
            const logEl = document.getElementById('debugLog');
            const toggleBtn = document.getElementById('debugToggle');

            if (debugLogVisible) {
                logEl.style.display = 'block';
                toggleBtn.textContent = 'Hide Debug Log';
                toggleBtn.classList.add('active');
            } else {
                logEl.style.display = 'none';
                toggleBtn.textContent = 'Show Debug Log';
                toggleBtn.classList.remove('active');
            }
        }

        // ============================================
        // DEBUG LOGGING SYSTEM
        // ============================================
        const DebugLog = {
            maxEntries: 50,
            entries: [],

            log(action, data, type = 'info') {
                const timestamp = new Date().toLocaleTimeString('en-US', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    fractionalSecondDigits: 3
                });

                const entry = { timestamp, action, data, type };
                this.entries.push(entry);

                // Keep only last N entries
                if (this.entries.length > this.maxEntries) {
                    this.entries.shift();
                }

                this.render();

                // Also log to console for developer tools
                console.log(`[${timestamp}] ${action}:`, data);
            },

            render() {
                const container = document.getElementById('debugLog');
                if (!container) return;

                container.innerHTML = this.entries.map(e => {
                    const dataStr = typeof e.data === 'object' ? JSON.stringify(e.data) : e.data;
                    return `<div class="log-entry">
                        <span class="timestamp">[${e.timestamp}]</span>
                        <span class="action">${e.action}</span>:
                        <span class="${e.type}">${dataStr}</span>
                    </div>`;
                }).join('');

                // Auto-scroll to bottom
                container.scrollTop = container.scrollHeight;
            }
        };

        // ============================================
        // STREAMLIT COMPONENT COMMUNICATION
        // ============================================
        function sendMessageToStreamlit(type, data) {
            const outData = Object.assign({
                isStreamlitMessage: true,
                type: type,
            }, data);
            window.parent.postMessage(outData, "*");
        }

        function setComponentReady() {
            sendMessageToStreamlit("streamlit:componentReady", {apiVersion: 1});
            DebugLog.log('COMPONENT_READY', 'Sent ready signal to Streamlit');
        }

        function setFrameHeight(height) {
            sendMessageToStreamlit("streamlit:setFrameHeight", {height: height});
        }

        function setComponentValue(value) {
            sendMessageToStreamlit("streamlit:setComponentValue", {value: value});
            DebugLog.log('SENT_TO_PYTHON', value, 'data');
        }

        // ============================================
        // UTILITY: Deep comparison for arrays
        // ============================================
        function arraysEqual(a, b) {
            if (a === b) return true;
            if (a == null || b == null) return false;
            if (a.length !== b.length) return false;

            for (let i = 0; i < a.length; i++) {
                if (Array.isArray(a[i]) && Array.isArray(b[i])) {
                    if (!arraysEqual(a[i], b[i])) return false;
                } else if (a[i] !== b[i]) {
                    return false;
                }
            }
            return true;
        }

        function linesToArray(lines) {
            return lines.map(line =>
                line.map(p => [p.x, p.y])
            );
        }

        // ============================================
        // CHART EDITOR CLASS
        // ============================================
        class ChartEditor {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');

                // Configuration
                this.padding = { top: 20, right: 20, bottom: 30, left: 50 };
                this.dotRadius = 8;
                this.hoverRadius = 12;
                this.lineWidth = 2;

                // State
                this.lines = [];
                this.colors = ["#FF6B6B", "#4ECDC4", "#45B7D1"];
                this.xRange = [0, 100];
                this.yRange = [0, 1000];
                this.gridSnap = null;
                this.activeLineIndex = 0;

                // STATE SYNC: Track recently sent values to Python
                // This prevents stale Streamlit reruns from overwriting our changes
                // We keep multiple values because rapid changes can cause out-of-order responses
                this.recentlySentData = [];  // Array of JSON strings
                this.maxRecentSent = 10;     // Keep last N sent values
                this.isFirstRender = true;

                // Interaction state
                this.hoveredPoint = null;
                this.draggingPoint = null;
                this.isDragging = false;

                // Bind event handlers
                this.handleMouseMove = this.handleMouseMove.bind(this);
                this.handleMouseDown = this.handleMouseDown.bind(this);
                this.handleMouseUp = this.handleMouseUp.bind(this);
                this.handleMouseLeave = this.handleMouseLeave.bind(this);

                // Attach events
                canvas.addEventListener('mousemove', this.handleMouseMove);
                canvas.addEventListener('mousedown', this.handleMouseDown);
                canvas.addEventListener('mouseup', this.handleMouseUp);
                canvas.addEventListener('mouseleave', this.handleMouseLeave);

                DebugLog.log('EDITOR_INIT', 'ChartEditor initialized');
            }

            setConfig(config) {
                DebugLog.log('RECEIVED_FROM_PYTHON', {
                    lines: config.lines,
                    isFirstRender: this.isFirstRender
                }, 'info');

                // Parse incoming lines
                const incomingLines = config.lines ?
                    config.lines.map(line => line ? line.map(p => ({x: p[0], y: p[1]})) : [])
                    : [];
                const incomingAsArray = config.lines || [];

                // STATE SYNC FIX:
                // Only update lines if:
                // 1. This is the first render (initial data from Python), OR
                // 2. Python is sending different data than what we last sent
                //    (meaning user/app explicitly changed the data)

                if (this.isFirstRender) {
                    DebugLog.log('FIRST_RENDER', 'Applying initial data from Python', 'info');
                    this.lines = incomingLines;
                    this.recentlySentData = [JSON.stringify(incomingAsArray)];
                    this.isFirstRender = false;
                } else {
                    const incomingStr = JSON.stringify(incomingAsArray);

                    // Check if incoming data matches ANY recently sent value
                    // This handles out-of-order responses from rapid changes
                    const matchIndex = this.recentlySentData.indexOf(incomingStr);

                    if (matchIndex !== -1) {
                        // Python is echoing back something we sent - ignore it
                        // BUT remove this entry so future identical data (like reset) won't match
                        this.recentlySentData.splice(matchIndex, 1);
                        DebugLog.log('IGNORED_ECHO', `Matched sent data at index ${matchIndex}, removed from buffer (${this.recentlySentData.length} remaining)`, 'warn');
                    } else {
                        // Python sent truly NEW data (e.g., user clicked a preset button)
                        DebugLog.log('EXTERNAL_UPDATE', 'Python sent new data, applying it', 'info');
                        this.lines = incomingLines;
                        // Clear recent sent data since we're accepting external data
                        this.recentlySentData = [incomingStr];
                    }
                }

                // Update other config (always apply these)
                if (config.xRange) this.xRange = config.xRange;
                if (config.yRange) this.yRange = config.yRange;
                if (config.colors) this.colors = config.colors;
                if (config.gridSnap) this.gridSnap = config.gridSnap;
                if (config.width) this.canvas.width = config.width;
                if (config.height) this.canvas.height = config.height;

                // Update UI elements
                document.getElementById('chartTitle').textContent = config.title || '';
                document.getElementById('xLabel').textContent = config.xLabel || '';
                document.getElementById('yLabel').textContent = config.yLabel || '';

                document.getElementById('xMin').value = this.xRange[0];
                document.getElementById('xMax').value = this.xRange[1];
                document.getElementById('yMin').value = this.yRange[0];
                document.getElementById('yMax').value = this.yRange[1];

                this.updateLineSelector();
                this.draw();
            }

            updateLineSelector() {
                const selector = document.getElementById('lineSelector');
                selector.innerHTML = '';

                // Ensure we have at least one line
                if (this.lines.length === 0) {
                    this.lines.push([]);
                }

                this.lines.forEach((line, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'line-btn' + (i === this.activeLineIndex ? ' active' : '');
                    btn.textContent = `Line ${i + 1} (${line.length} pts)`;
                    btn.style.borderColor = this.colors[i % this.colors.length];
                    if (i === this.activeLineIndex) {
                        btn.style.backgroundColor = this.colors[i % this.colors.length];
                    } else {
                        btn.style.color = this.colors[i % this.colors.length];
                    }
                    btn.onclick = () => {
                        this.activeLineIndex = i;
                        DebugLog.log('LINE_SELECTED', `Switched to Line ${i + 1}`);
                        this.updateLineSelector();
                        this.draw();
                    };
                    selector.appendChild(btn);
                });

                // Add "+" button for new line (max 5 lines)
                if (this.lines.length < 5) {
                    const addBtn = document.createElement('button');
                    addBtn.className = 'add-line-btn';
                    addBtn.textContent = '+ Add Line';
                    addBtn.onclick = () => {
                        this.lines.push([]);
                        this.activeLineIndex = this.lines.length - 1;
                        DebugLog.log('LINE_ADDED', `Added Line ${this.lines.length}`);
                        this.updateLineSelector();
                        this.draw();
                        this.notifyChange('added new line');
                    };
                    selector.appendChild(addBtn);
                }
            }

            // Coordinate conversion
            dataToCanvas(x, y) {
                const chartWidth = this.canvas.width - this.padding.left - this.padding.right;
                const chartHeight = this.canvas.height - this.padding.top - this.padding.bottom;

                const canvasX = this.padding.left +
                    ((x - this.xRange[0]) / (this.xRange[1] - this.xRange[0])) * chartWidth;
                const canvasY = this.padding.top +
                    (1 - (y - this.yRange[0]) / (this.yRange[1] - this.yRange[0])) * chartHeight;

                return {x: canvasX, y: canvasY};
            }

            canvasToData(canvasX, canvasY) {
                const chartWidth = this.canvas.width - this.padding.left - this.padding.right;
                const chartHeight = this.canvas.height - this.padding.top - this.padding.bottom;

                let x = this.xRange[0] +
                    ((canvasX - this.padding.left) / chartWidth) * (this.xRange[1] - this.xRange[0]);
                let y = this.yRange[0] +
                    (1 - (canvasY - this.padding.top) / chartHeight) * (this.yRange[1] - this.yRange[0]);

                // Apply grid snapping
                if (this.gridSnap) {
                    const xStep = (this.xRange[1] - this.xRange[0]) * this.gridSnap[0] / 100;
                    const yStep = (this.yRange[1] - this.yRange[0]) * this.gridSnap[1] / 100;
                    x = Math.round(x / xStep) * xStep;
                    y = Math.round(y / yStep) * yStep;
                }

                // Clamp to range
                x = Math.max(this.xRange[0], Math.min(this.xRange[1], x));
                y = Math.max(this.yRange[0], Math.min(this.yRange[1], y));

                return {x, y};
            }

            // Check if X coordinate would conflict with existing point in a line
            // excludeIndex: point index to exclude (for drag operations)
            hasConflictingX(lineIndex, x, excludeIndex = -1) {
                const line = this.lines[lineIndex];
                if (!line) return false;

                // Tolerance: points within 1% of X range are considered "same X"
                const tolerance = (this.xRange[1] - this.xRange[0]) * 0.01;

                for (let i = 0; i < line.length; i++) {
                    if (i === excludeIndex) continue;
                    if (Math.abs(line[i].x - x) < tolerance) {
                        return true;
                    }
                }
                return false;
            }

            findPointAt(canvasX, canvasY) {
                for (let lineIndex = 0; lineIndex < this.lines.length; lineIndex++) {
                    const line = this.lines[lineIndex];
                    for (let pointIndex = 0; pointIndex < line.length; pointIndex++) {
                        const point = line[pointIndex];
                        const canvasPoint = this.dataToCanvas(point.x, point.y);
                        const dist = Math.sqrt(
                            Math.pow(canvasX - canvasPoint.x, 2) +
                            Math.pow(canvasY - canvasPoint.y, 2)
                        );
                        if (dist <= this.hoverRadius) {
                            return {lineIndex, pointIndex};
                        }
                    }
                }
                return null;
            }

            isInChartArea(canvasX, canvasY) {
                return canvasX >= this.padding.left &&
                       canvasX <= this.canvas.width - this.padding.right &&
                       canvasY >= this.padding.top &&
                       canvasY <= this.canvas.height - this.padding.bottom;
            }

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const canvasX = e.clientX - rect.left;
                const canvasY = e.clientY - rect.top;

                // Detect drag start
                if (this.draggingPoint && !this.isDragging) {
                    const moved = Math.sqrt(
                        Math.pow(canvasX - this.dragStartX, 2) +
                        Math.pow(canvasY - this.dragStartY, 2)
                    );
                    if (moved > 5) {
                        this.isDragging = true;
                        DebugLog.log('DRAG_START', {
                            line: this.draggingPoint.lineIndex + 1,
                            point: this.draggingPoint.pointIndex
                        });
                    }
                }

                if (this.isDragging && this.draggingPoint) {
                    // Update point position
                    const dataPos = this.canvasToData(canvasX, canvasY);
                    const line = this.lines[this.draggingPoint.lineIndex];
                    const oldPos = {...line[this.draggingPoint.pointIndex]};
                    line[this.draggingPoint.pointIndex] = dataPos;

                    // Re-sort line by X
                    const pointData = line[this.draggingPoint.pointIndex];
                    line.sort((a, b) => a.x - b.x);
                    // Update point index after sort
                    const newIndex = line.indexOf(pointData);
                    if (newIndex !== this.draggingPoint.pointIndex) {
                        this.draggingPoint.pointIndex = newIndex;
                    }

                    this.draw();
                    this.showTooltip(canvasX, canvasY, dataPos);
                } else {
                    // Check for hover
                    const point = this.findPointAt(canvasX, canvasY);
                    if (point) {
                        this.hoveredPoint = point;
                        this.canvas.style.cursor = 'pointer';
                        const p = this.lines[point.lineIndex][point.pointIndex];
                        this.showTooltip(canvasX, canvasY, p);
                    } else if (this.isInChartArea(canvasX, canvasY)) {
                        this.hoveredPoint = null;
                        this.canvas.style.cursor = 'crosshair';
                        this.hideTooltip();
                    } else {
                        this.hoveredPoint = null;
                        this.canvas.style.cursor = 'default';
                        this.hideTooltip();
                    }
                    this.draw();
                }
            }

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const canvasX = e.clientX - rect.left;
                const canvasY = e.clientY - rect.top;

                const point = this.findPointAt(canvasX, canvasY);

                if (point) {
                    // Start dragging or prepare for removal
                    this.draggingPoint = point;
                    this.dragStartTime = Date.now();
                    this.dragStartX = canvasX;
                    this.dragStartY = canvasY;
                    // Switch to this line
                    this.activeLineIndex = point.lineIndex;

                    const p = this.lines[point.lineIndex][point.pointIndex];
                    // Save original position for potential revert on cancelled drag
                    this.dragOriginalPos = {x: p.x, y: p.y};

                    DebugLog.log('MOUSEDOWN_ON_POINT', {
                        line: point.lineIndex + 1,
                        pointIndex: point.pointIndex,
                        coords: {x: p.x.toFixed(2), y: p.y.toFixed(2)}
                    });

                    this.updateLineSelector();
                } else if (this.isInChartArea(canvasX, canvasY)) {
                    // Add new point to active line
                    const dataPos = this.canvasToData(canvasX, canvasY);

                    // Ensure active line exists
                    while (this.lines.length <= this.activeLineIndex) {
                        this.lines.push([]);
                    }

                    // Check for X conflict before adding
                    if (this.hasConflictingX(this.activeLineIndex, dataPos.x)) {
                        DebugLog.log('ADD_BLOCKED', {
                            reason: 'X coordinate too close to existing point',
                            coords: {x: dataPos.x.toFixed(2), y: dataPos.y.toFixed(2)}
                        }, 'warn');
                        return; // Don't add the point
                    }

                    this.lines[this.activeLineIndex].push(dataPos);
                    // Sort by X
                    this.lines[this.activeLineIndex].sort((a, b) => a.x - b.x);

                    DebugLog.log('POINT_ADDED', {
                        line: this.activeLineIndex + 1,
                        coords: {x: dataPos.x.toFixed(2), y: dataPos.y.toFixed(2)},
                        totalPoints: this.lines[this.activeLineIndex].length
                    });

                    this.updateLineSelector();
                    this.draw();
                    this.notifyChange('added point');
                }
            }

            handleMouseUp(e) {
                if (this.draggingPoint) {
                    const rect = this.canvas.getBoundingClientRect();
                    const canvasX = e.clientX - rect.left;
                    const canvasY = e.clientY - rect.top;

                    const elapsed = Date.now() - this.dragStartTime;
                    const moved = Math.sqrt(
                        Math.pow(canvasX - this.dragStartX, 2) +
                        Math.pow(canvasY - this.dragStartY, 2)
                    );

                    if (elapsed < 300 && moved < 5) {
                        // This was a click, remove the point
                        const removedPoint = this.lines[this.draggingPoint.lineIndex][this.draggingPoint.pointIndex];
                        this.lines[this.draggingPoint.lineIndex].splice(this.draggingPoint.pointIndex, 1);

                        DebugLog.log('POINT_REMOVED', {
                            line: this.draggingPoint.lineIndex + 1,
                            coords: {x: removedPoint.x.toFixed(2), y: removedPoint.y.toFixed(2)},
                            remaining: this.lines[this.draggingPoint.lineIndex].length
                        });

                        this.notifyChange('removed point');
                    } else if (this.isDragging) {
                        // Was a drag operation - check for X conflict
                        const line = this.lines[this.draggingPoint.lineIndex];
                        const currentPoint = line[this.draggingPoint.pointIndex];

                        // Find the point's current index after sorting
                        const currentIndex = line.findIndex(p => p === currentPoint);

                        if (this.hasConflictingX(this.draggingPoint.lineIndex, currentPoint.x, currentIndex)) {
                            // X conflict! Revert to original position
                            line[currentIndex] = {...this.dragOriginalPos};
                            line.sort((a, b) => a.x - b.x);

                            DebugLog.log('DRAG_REVERTED', {
                                reason: 'X coordinate too close to existing point',
                                restoredTo: {x: this.dragOriginalPos.x.toFixed(2), y: this.dragOriginalPos.y.toFixed(2)}
                            }, 'warn');
                            // Don't notify Python - we reverted
                        } else {
                            // Valid drag
                            DebugLog.log('DRAG_END', {
                                line: this.draggingPoint.lineIndex + 1,
                                newCoords: {x: currentPoint.x.toFixed(2), y: currentPoint.y.toFixed(2)}
                            });
                            this.notifyChange('dragged point');
                        }
                    }

                    this.isDragging = false;
                    this.draggingPoint = null;
                    this.dragOriginalPos = null;
                    this.updateLineSelector();
                    this.draw();
                }
            }

            handleMouseLeave() {
                if (this.isDragging && this.draggingPoint && this.dragOriginalPos) {
                    // REVERT to original position - don't save edge-clamped position
                    const line = this.lines[this.draggingPoint.lineIndex];
                    line[this.draggingPoint.pointIndex] = {...this.dragOriginalPos};
                    // Re-sort by X (in case it moved)
                    line.sort((a, b) => a.x - b.x);

                    DebugLog.log('DRAG_REVERTED', {
                        reason: 'Mouse left canvas',
                        restoredTo: {x: this.dragOriginalPos.x.toFixed(2), y: this.dragOriginalPos.y.toFixed(2)}
                    }, 'warn');
                    // Don't notify Python - we reverted to original state
                }
                this.isDragging = false;
                this.draggingPoint = null;
                this.dragOriginalPos = null;
                this.hoveredPoint = null;
                this.hideTooltip();
                this.draw();
            }

            showTooltip(x, y, dataPoint) {
                const tooltip = document.getElementById('tooltip');
                tooltip.textContent = `(${dataPoint.x.toFixed(2)}, ${dataPoint.y.toFixed(2)})`;
                tooltip.style.left = (x + 15) + 'px';
                tooltip.style.top = (y - 10) + 'px';
                tooltip.style.display = 'block';
            }

            hideTooltip() {
                document.getElementById('tooltip').style.display = 'none';
            }

            notifyChange(reason) {
                // Convert to format expected by Python
                const data = this.lines.map(line =>
                    line.map(p => [p.x, p.y])
                );

                // Add to our record of recently sent values
                const dataStr = JSON.stringify(data);
                this.recentlySentData.push(dataStr);

                // Keep only the last N values
                while (this.recentlySentData.length > this.maxRecentSent) {
                    this.recentlySentData.shift();
                }

                DebugLog.log('NOTIFY_CHANGE', {
                    reason: reason,
                    data: data,
                    recentSentCount: this.recentlySentData.length
                }, 'data');

                setComponentValue(data);
            }

            updateRange(axis, minOrMax, value) {
                const val = parseFloat(value);
                if (isNaN(val)) return;

                if (axis === 'x') {
                    if (minOrMax === 'min') this.xRange[0] = val;
                    else this.xRange[1] = val;
                } else {
                    if (minOrMax === 'min') this.yRange[0] = val;
                    else this.yRange[1] = val;
                }

                DebugLog.log('RANGE_CHANGED', {axis, minOrMax, value: val});
                this.draw();
            }

            draw() {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                // Clear canvas
                ctx.fillStyle = '#fafafa';
                ctx.fillRect(0, 0, width, height);

                // Draw grid
                this.drawGrid();

                // Draw axes
                this.drawAxes();

                // Draw lines and points
                this.lines.forEach((line, lineIndex) => {
                    if (line.length === 0) return;

                    const color = this.colors[lineIndex % this.colors.length];

                    // Draw line segments
                    if (line.length >= 2) {
                        ctx.beginPath();
                        ctx.strokeStyle = color;
                        ctx.lineWidth = this.lineWidth;

                        const firstPoint = this.dataToCanvas(line[0].x, line[0].y);
                        ctx.moveTo(firstPoint.x, firstPoint.y);

                        for (let i = 1; i < line.length; i++) {
                            const point = this.dataToCanvas(line[i].x, line[i].y);
                            ctx.lineTo(point.x, point.y);
                        }
                        ctx.stroke();
                    }

                    // Draw points
                    line.forEach((point, pointIndex) => {
                        const canvasPoint = this.dataToCanvas(point.x, point.y);
                        const isHovered = this.hoveredPoint &&
                            this.hoveredPoint.lineIndex === lineIndex &&
                            this.hoveredPoint.pointIndex === pointIndex;
                        const isDragging = this.draggingPoint &&
                            this.draggingPoint.lineIndex === lineIndex &&
                            this.draggingPoint.pointIndex === pointIndex;

                        // Draw outer ring for hover/drag
                        if (isHovered || isDragging) {
                            ctx.beginPath();
                            ctx.arc(canvasPoint.x, canvasPoint.y, this.dotRadius + 4, 0, Math.PI * 2);
                            ctx.fillStyle = color + '40';
                            ctx.fill();
                        }

                        // Draw point
                        ctx.beginPath();
                        ctx.arc(canvasPoint.x, canvasPoint.y, this.dotRadius, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    });
                });
            }

            drawGrid() {
                const ctx = this.ctx;
                const chartWidth = this.canvas.width - this.padding.left - this.padding.right;
                const chartHeight = this.canvas.height - this.padding.top - this.padding.bottom;

                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 1;

                const xDivisions = 10;
                for (let i = 0; i <= xDivisions; i++) {
                    const x = this.padding.left + (i / xDivisions) * chartWidth;
                    ctx.beginPath();
                    ctx.moveTo(x, this.padding.top);
                    ctx.lineTo(x, this.padding.top + chartHeight);
                    ctx.stroke();
                }

                const yDivisions = 10;
                for (let i = 0; i <= yDivisions; i++) {
                    const y = this.padding.top + (i / yDivisions) * chartHeight;
                    ctx.beginPath();
                    ctx.moveTo(this.padding.left, y);
                    ctx.lineTo(this.padding.left + chartWidth, y);
                    ctx.stroke();
                }
            }

            drawAxes() {
                const ctx = this.ctx;
                const chartWidth = this.canvas.width - this.padding.left - this.padding.right;
                const chartHeight = this.canvas.height - this.padding.top - this.padding.bottom;

                ctx.fillStyle = '#666';
                ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';

                const xDivisions = 5;
                for (let i = 0; i <= xDivisions; i++) {
                    const x = this.padding.left + (i / xDivisions) * chartWidth;
                    const value = this.xRange[0] + (i / xDivisions) * (this.xRange[1] - this.xRange[0]);
                    ctx.textAlign = 'center';
                    ctx.fillText(value.toFixed(0), x, this.canvas.height - this.padding.bottom + 15);
                }

                const yDivisions = 5;
                for (let i = 0; i <= yDivisions; i++) {
                    const y = this.padding.top + (i / yDivisions) * chartHeight;
                    const value = this.yRange[1] - (i / yDivisions) * (this.yRange[1] - this.yRange[0]);
                    ctx.textAlign = 'right';
                    ctx.fillText(value.toFixed(0), this.padding.left - 5, y + 4);
                }
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        let editor = null;

        function init() {
            DebugLog.log('INIT', 'Starting component initialization');

            const canvas = document.getElementById('chartCanvas');
            editor = new ChartEditor(canvas);

            // Handle range input changes
            document.getElementById('xMin').addEventListener('change', (e) => {
                editor.updateRange('x', 'min', e.target.value);
            });
            document.getElementById('xMax').addEventListener('change', (e) => {
                editor.updateRange('x', 'max', e.target.value);
            });
            document.getElementById('yMin').addEventListener('change', (e) => {
                editor.updateRange('y', 'min', e.target.value);
            });
            document.getElementById('yMax').addEventListener('change', (e) => {
                editor.updateRange('y', 'max', e.target.value);
            });

            // Listen for messages from Streamlit
            window.addEventListener('message', (event) => {
                if (event.data.type === 'streamlit:render') {
                    DebugLog.log('STREAMLIT_RENDER', 'Received render message from Streamlit');

                    const args = event.data.args;
                    editor.setConfig({
                        lines: args.lines || [],
                        xRange: args.xRange || [0, 100],
                        yRange: args.yRange || [0, 1000],
                        colors: args.colors || ["#FF6B6B", "#4ECDC4", "#45B7D1"],
                        gridSnap: args.gridSnap || null,
                        title: args.title || '',
                        xLabel: args.xLabel || '',
                        yLabel: args.yLabel || '',
                        width: args.width || 700,
                        height: args.height || 450
                    });

                    // Set frame height
                    setTimeout(() => {
                        setFrameHeight(document.body.scrollHeight);
                    }, 100);
                }
            });

            setComponentReady();
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
