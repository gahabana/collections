                        ctx.fillStyle = '#333';
                        ctx.fill();

                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 10px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(lineCount.toString(), badgeX, badgeY);
                    }
                });
            }

            drawGrid() {
                const ctx = this.ctx;
                const chartWidth = this.canvas.width - this.padding.left - this.padding.right;
                const chartHeight = this.canvas.height - this.padding.top - this.padding.bottom;
                const isDark = this.isDarkMode();

                ctx.strokeStyle = isDark ? '#333' : '#e0e0e0';
                ctx.lineWidth = 1;

                for (let i = 0; i <= 10; i++) {
                    const x = this.padding.left + (i / 10) * chartWidth;
                    ctx.beginPath();
                    ctx.moveTo(x, this.padding.top);
                    ctx.lineTo(x, this.padding.top + chartHeight);
                    ctx.stroke();
                }

                for (let i = 0; i <= 10; i++) {
                    const y = this.padding.top + (i / 10) * chartHeight;
                    ctx.beginPath();
                    ctx.moveTo(this.padding.left, y);
                    ctx.lineTo(this.padding.left + chartWidth, y);
                    ctx.stroke();
                }
            }

            drawAxes() {
                const ctx = this.ctx;
                const chartWidth = this.canvas.width - this.padding.left - this.padding.right;
                const chartHeight = this.canvas.height - this.padding.top - this.padding.bottom;
                const isDark = this.isDarkMode();

                ctx.fillStyle = isDark ? '#a0a0a0' : '#666';
                ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';

                for (let i = 0; i <= 5; i++) {
                    const x = this.padding.left + (i / 5) * chartWidth;
                    const value = this.xRange[0] + (i / 5) * (this.xRange[1] - this.xRange[0]);
                    ctx.textAlign = 'center';
                    ctx.fillText(value.toFixed(0), x, this.canvas.height - this.padding.bottom + 15);
                }

                for (let i = 0; i <= 5; i++) {
                    const y = this.padding.top + (i / 5) * chartHeight;
                    const value = this.yRange[1] - (i / 5) * (this.yRange[1] - this.yRange[0]);
                    ctx.textAlign = 'right';
                    ctx.fillText(value.toFixed(0), this.padding.left - 5, y + 4);
                }
            }

            // ============================================
            // ZOOM / PAN METHODS
            // ============================================

            handleWheel(e) {
                if (!this.zoomEnabled) return;

                e.preventDefault();

                const rect = this.canvas.getBoundingClientRect();
                const canvasX = e.clientX - rect.left;
                const canvasY = e.clientY - rect.top;

                // Only zoom if cursor is in chart area
                if (!this.isInChartArea(canvasX, canvasY)) return;

                // Get data coordinates at cursor position (zoom center)
                const dataPos = this.canvasToData(canvasX, canvasY);

                // Determine zoom direction and factor
                const zoomFactor = e.deltaY < 0 ? 0.9 : 1.1; // Scroll up = zoom in

                // Calculate new ranges centered on cursor position
                const xRangeSize = this.xRange[1] - this.xRange[0];
                const yRangeSize = this.yRange[1] - this.yRange[0];

                // Guard against division by zero
                if (xRangeSize === 0 || yRangeSize === 0) return;

                const newXRangeSize = xRangeSize * zoomFactor;
                const newYRangeSize = yRangeSize * zoomFactor;

                // Calculate cursor position as fraction of current range
                const xFraction = (dataPos.x - this.xRange[0]) / xRangeSize;
                const yFraction = (dataPos.y - this.yRange[0]) / yRangeSize;

                // New range keeps cursor at same visual position
                const newXMin = dataPos.x - xFraction * newXRangeSize;
                const newXMax = newXMin + newXRangeSize;
                const newYMin = dataPos.y - yFraction * newYRangeSize;
                const newYMax = newYMin + newYRangeSize;

                // Apply zoom with limits
                this.setZoomRange(newXMin, newXMax, newYMin, newYMax);
            }

            setZoomRange(xMin, xMax, yMin, yMax, notify = true) {
                // Enforce minimum zoom (don't zoom in too far - minimum 5% of original range)
                const originalXSize = this.originalXRange[1] - this.originalXRange[0];
                const originalYSize = this.originalYRange[1] - this.originalYRange[0];

                // Guard against zero original range
                if (originalXSize === 0 || originalYSize === 0) return;

                const minXRange = originalXSize * 0.05;
                const minYRange = originalYSize * 0.05;

                if (xMax - xMin < minXRange) {
                    const center = (xMax + xMin) / 2;
                    xMin = center - minXRange / 2;
                    xMax = center + minXRange / 2;
                }

                if (yMax - yMin < minYRange) {
                    const center = (yMax + yMin) / 2;
                    yMin = center - minYRange / 2;
                    yMax = center + minYRange / 2;
                }

                // Enforce maximum zoom out (don't exceed original range)
                const origXSize = this.originalXRange[1] - this.originalXRange[0];
                const origYSize = this.originalYRange[1] - this.originalYRange[0];

                if (xMax - xMin > origXSize) {
                    xMin = this.originalXRange[0];
                    xMax = this.originalXRange[1];
                }

                if (yMax - yMin > origYSize) {
                    yMin = this.originalYRange[0];
                    yMax = this.originalYRange[1];
                }

                // Clamp to stay within original bounds (no panning outside data range)
                if (xMin < this.originalXRange[0]) {
                    const shift = this.originalXRange[0] - xMin;
                    xMin = this.originalXRange[0];
                    xMax = Math.min(xMax + shift, this.originalXRange[1]);
                }
                if (xMax > this.originalXRange[1]) {
                    const shift = xMax - this.originalXRange[1];
                    xMax = this.originalXRange[1];
                    xMin = Math.max(xMin - shift, this.originalXRange[0]);
                }

                if (yMin < this.originalYRange[0]) {
                    const shift = this.originalYRange[0] - yMin;
                    yMin = this.originalYRange[0];
                    yMax = Math.min(yMax + shift, this.originalYRange[1]);
                }
                if (yMax > this.originalYRange[1]) {
                    const shift = yMax - this.originalYRange[1];
                    yMax = this.originalYRange[1];
                    yMin = Math.max(yMin - shift, this.originalYRange[0]);
                }

                this.xRange = [xMin, xMax];
                this.yRange = [yMin, yMax];

                // Calculate zoom level (based on X axis)
                const currentXSize = xMax - xMin;
                // Guard against division by zero
                this.zoomLevel = currentXSize > 0 ? originalXSize / currentXSize : 1;

                // Update UI
                this.updateZoomInfo();
                this.updateRangeInputs();
                // Update range selector (if not currently being dragged)
                if (!this.rangeSelector.dragging) {
                    this.updateRangeSelector();
                }
                this.draw();

                // Notify callback
                if (notify && this.onZoomCallback) {
                    this.onZoomCallback({
                        xRange: [...this.xRange],
                        yRange: [...this.yRange],
                        zoomLevel: this.zoomLevel
                    });
                }

                // Send zoom state to Python
                if (notify) {
                    this.sendZoomState();
                }

                DebugLog.log('ZOOM_CHANGED', {
                    xRange: [xMin.toFixed(2), xMax.toFixed(2)],
                    yRange: [yMin.toFixed(2), yMax.toFixed(2)],
                    zoomLevel: this.zoomLevel.toFixed(2)
                });
            }

            sendZoomState() {
                // Include lines data with zoom events to prevent data loss
                const linesData = this.lines.map(line => line.map(p => [p.x, p.y]));
                sendMessageToStreamlit("streamlit:setComponentValue", {
                    value: {
                        type: 'zoom',
                        lines: linesData,
                        xRange: this.xRange,
                        yRange: this.yRange,
                        zoomLevel: this.zoomLevel
                    }
                });
            }

            updateZoomInfo() {
                const zoomInfo = document.getElementById('zoomInfo');
                if (zoomInfo) {
                    zoomInfo.textContent = `${Math.round(this.zoomLevel * 100)}%`;
                }
            }

            updateRangeInputs() {
                document.getElementById('xMin').value = this.xRange[0].toFixed(2);
                document.getElementById('xMax').value = this.xRange[1].toFixed(2);
                document.getElementById('yMin').value = this.yRange[0].toFixed(2);
                document.getElementById('yMax').value = this.yRange[1].toFixed(2);
            }

            zoomIn() {
                if (!this.zoomEnabled) return;

                const xCenter = (this.xRange[0] + this.xRange[1]) / 2;
                const yCenter = (this.yRange[0] + this.yRange[1]) / 2;
                const xHalf = (this.xRange[1] - this.xRange[0]) / 2 * 0.8;
                const yHalf = (this.yRange[1] - this.yRange[0]) / 2 * 0.8;

                this.animateZoom(
                    xCenter - xHalf,
                    xCenter + xHalf,
                    yCenter - yHalf,
                    yCenter + yHalf
                );
            }

            zoomOut() {
                if (!this.zoomEnabled) return;

                const xCenter = (this.xRange[0] + this.xRange[1]) / 2;
                const yCenter = (this.yRange[0] + this.yRange[1]) / 2;
                const xHalf = (this.xRange[1] - this.xRange[0]) / 2 * 1.25;
                const yHalf = (this.yRange[1] - this.yRange[0]) / 2 * 1.25;

                this.animateZoom(
                    xCenter - xHalf,
                    xCenter + xHalf,
                    yCenter - yHalf,
                    yCenter + yHalf
                );
            }

            resetZoom() {
                if (!this.zoomEnabled) return;

                this.animateZoom(
                    this.originalXRange[0],
                    this.originalXRange[1],
                    this.originalYRange[0],
                    this.originalYRange[1]
                );

                DebugLog.log('ZOOM_RESET', 'Reset to original range');
            }

            fitToData() {
                if (!this.zoomEnabled) return;

                // Find data bounds
                let minX = Infinity, maxX = -Infinity;
                let minY = Infinity, maxY = -Infinity;

                this.lines.forEach(line => {
                    line.forEach(point => {
                        minX = Math.min(minX, point.x);
                        maxX = Math.max(maxX, point.x);
                        minY = Math.min(minY, point.y);
                        maxY = Math.max(maxY, point.y);
                    });
                });

                if (minX === Infinity) {
                    // No data, reset to original
                    this.resetZoom();
                    return;
                }

                // Add 10% padding
                const xPadding = (maxX - minX) * 0.1 || 1;
                const yPadding = (maxY - minY) * 0.1 || 1;

                this.animateZoom(
                    minX - xPadding,
                    maxX + xPadding,
                    minY - yPadding,
                    maxY + yPadding
                );

                DebugLog.log('FIT_TO_DATA', {
                    xRange: [minX - xPadding, maxX + xPadding],
                    yRange: [minY - yPadding, maxY + yPadding]
                });
            }

            // Programmatic zoom to specific range (for external control / sync)
            zoomTo(xMin, xMax, yMin, yMax, notify = true) {
                this.setZoomRange(xMin, xMax, yMin, yMax, notify);
            }

            // Start panning
            startPan(canvasX, canvasY) {
                this.isPanning = true;
                this.panStartX = canvasX;
                this.panStartY = canvasY;
                this.panStartXRange = [...this.xRange];
                this.panStartYRange = [...this.yRange];
                this.canvas.classList.add('panning');
            }

            // Update pan
            updatePan(canvasX, canvasY) {
                if (!this.isPanning) return;

                const chartWidth = this.canvas.width - this.padding.left - this.padding.right;
                const chartHeight = this.canvas.height - this.padding.top - this.padding.bottom;

                // Calculate how much to pan in data units
                const dx = canvasX - this.panStartX;
                const dy = canvasY - this.panStartY;

                const xRangeSize = this.panStartXRange[1] - this.panStartXRange[0];
                const yRangeSize = this.panStartYRange[1] - this.panStartYRange[0];

                const dataXShift = -(dx / chartWidth) * xRangeSize;
                const dataYShift = (dy / chartHeight) * yRangeSize;

                this.setZoomRange(
                    this.panStartXRange[0] + dataXShift,
                    this.panStartXRange[1] + dataXShift,
                    this.panStartYRange[0] + dataYShift,
                    this.panStartYRange[1] + dataYShift,
                    false // Don't notify during drag
                );
            }

            // End panning
            endPan() {
                if (this.isPanning) {
                    this.isPanning = false;
                    this.canvas.classList.remove('panning');
                    // Notify on pan end
                    if (this.onZoomCallback) {
                        this.onZoomCallback({
                            xRange: [...this.xRange],
                            yRange: [...this.yRange],
                            zoomLevel: this.zoomLevel
                        });
                    }
                    this.sendZoomState();
                }
            }

            // ============================================
            // RANGE SELECTOR (X-axis zoom brush)
            // ============================================

            setupRangeSelector() {
                if (this._rangeSelectorSetup) return;
                this._rangeSelectorSetup = true;

                const viewport = document.getElementById('rangeSelectorViewport');
                const handleLeft = document.getElementById('rangeHandleLeft');
                const handleRight = document.getElementById('rangeHandleRight');
                const track = document.querySelector('.range-selector-track');

                // Mouse down on viewport (drag entire range)
                viewport.addEventListener('mousedown', (e) => {
                    if (e.target === handleLeft || e.target === handleRight) return;
                    e.preventDefault();
                    this.rangeSelector.dragging = 'viewport';
                    this.rangeSelector.startX = e.clientX;
                    this.rangeSelector.startLeft = parseFloat(viewport.style.left) || 0;
                    this.rangeSelector.startWidth = parseFloat(viewport.style.width) || 100;
                });

                // Mouse down on left handle
                handleLeft.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.rangeSelector.dragging = 'left';
                    this.rangeSelector.startX = e.clientX;
                    this.rangeSelector.startLeft = parseFloat(viewport.style.left) || 0;
                    this.rangeSelector.startWidth = parseFloat(viewport.style.width) || 100;
                });

                // Mouse down on right handle
                handleRight.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.rangeSelector.dragging = 'right';
                    this.rangeSelector.startX = e.clientX;
                    this.rangeSelector.startLeft = parseFloat(viewport.style.left) || 0;
                    this.rangeSelector.startWidth = parseFloat(viewport.style.width) || 100;
                });

                // Mouse move (global)
                document.addEventListener('mousemove', (e) => {
                    if (!this.rangeSelector.dragging) return;

                    const trackRect = track.getBoundingClientRect();
                    const trackWidth = trackRect.width;
                    const dx = e.clientX - this.rangeSelector.startX;
                    const dxPercent = (dx / trackWidth) * 100;

                    let newLeft = this.rangeSelector.startLeft;
                    let newWidth = this.rangeSelector.startWidth;

                    if (this.rangeSelector.dragging === 'viewport') {
                        // Move entire viewport
                        newLeft = this.rangeSelector.startLeft + dxPercent;
                        // Clamp to track bounds
                        newLeft = Math.max(0, Math.min(100 - newWidth, newLeft));
                    } else if (this.rangeSelector.dragging === 'left') {
                        // Resize from left
                        newLeft = this.rangeSelector.startLeft + dxPercent;
                        newWidth = this.rangeSelector.startWidth - dxPercent;
                        // Minimum width and bounds
                        if (newWidth < 5) {
                            newWidth = 5;
                            newLeft = this.rangeSelector.startLeft + this.rangeSelector.startWidth - 5;
                        }
                        if (newLeft < 0) {
                            newWidth += newLeft;
                            newLeft = 0;
                        }
                    } else if (this.rangeSelector.dragging === 'right') {
                        // Resize from right
                        newWidth = this.rangeSelector.startWidth + dxPercent;
                        // Minimum width and bounds
                        if (newWidth < 5) newWidth = 5;
                        if (newLeft + newWidth > 100) newWidth = 100 - newLeft;
                    }

                    // Apply to viewport
                    viewport.style.left = newLeft + '%';
                    viewport.style.width = newWidth + '%';

                    // Update chart xRange
                    this.applyRangeSelectorToChart(newLeft, newWidth);
                });

                // Mouse up (global)
                document.addEventListener('mouseup', () => {
                    if (this.rangeSelector.dragging) {
                        this.rangeSelector.dragging = null;
                        // Send final zoom state
                        this.sendZoomState();
                    }
                });

                // Double-click to reset
                viewport.addEventListener('dblclick', () => {
                    this.resetZoom();
                });
            }

            applyRangeSelectorToChart(leftPercent, widthPercent) {
                // Convert percentages to data coordinates
                const fullRange = this.originalXRange[1] - this.originalXRange[0];

                // Guard against zero full range
                if (fullRange === 0) return;

                const newXMin = this.originalXRange[0] + (leftPercent / 100) * fullRange;
                const newXMax = this.originalXRange[0] + ((leftPercent + widthPercent) / 100) * fullRange;

                // Update chart range (don't trigger range selector update to avoid loop)
                this.xRange = [newXMin, newXMax];

                // Calculate zoom level
                const currentXSize = newXMax - newXMin;
                // Guard against division by zero
                this.zoomLevel = currentXSize > 0 ? fullRange / currentXSize : 1;

                // Update UI
                this.updateZoomInfo();
                this.updateRangeLabels(newXMin, newXMax);
                this.draw();
            }

            updateRangeSelector() {
                if (!this.rangeSelector.enabled) return;

                const viewport = document.getElementById('rangeSelectorViewport');
                if (!viewport) return;

                // Calculate viewport position from current xRange
                const fullRange = this.originalXRange[1] - this.originalXRange[0];

                // Guard against division by zero
                if (fullRange === 0) {
                    viewport.style.left = '0%';
                    viewport.style.width = '100%';
                    return;
                }

                const leftPercent = ((this.xRange[0] - this.originalXRange[0]) / fullRange) * 100;
                const rightPercent = ((this.xRange[1] - this.originalXRange[0]) / fullRange) * 100;
                const widthPercent = rightPercent - leftPercent;

                // Clamp values
                const clampedLeft = Math.max(0, Math.min(100, leftPercent));
                const clampedWidth = Math.max(5, Math.min(100 - clampedLeft, widthPercent));

                viewport.style.left = clampedLeft + '%';
                viewport.style.width = clampedWidth + '%';

                this.updateRangeLabels(this.xRange[0], this.xRange[1]);
            }

            updateRangeLabels(xMin, xMax) {
                const labelLeft = document.getElementById('rangeLabelLeft');
                const labelRight = document.getElementById('rangeLabelRight');
                const labelCenter = document.getElementById('rangeLabelCenter');

                if (labelLeft) labelLeft.textContent = Math.round(this.originalXRange[0]);
                if (labelRight) labelRight.textContent = Math.round(this.originalXRange[1]);
                if (labelCenter) labelCenter.textContent = `${Math.round(xMin)} - ${Math.round(xMax)}`;
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        let editor = null;

        function init() {
            DebugLog.log('INIT', 'Starting component initialization');

            const canvas = document.getElementById('chartCanvas');
            editor = new ChartEditor(canvas);

            // Debug toggle button
            document.getElementById('debugToggle').addEventListener('click', () => {
                DebugLog.toggle();
            });

            // Save button
            document.getElementById('btnSave').addEventListener('click', () => {
                editor.saveChanges();
            });

            // Cancel button
            document.getElementById('btnCancel').addEventListener('click', () => {
                editor.cancelChanges();
            });

            // Undo/Redo buttons
            document.getElementById('btnUndo').addEventListener('click', () => {
                if (editor.undo()) {
                    editor.enterEditMode();
                }
            });
            document.getElementById('btnRedo').addEventListener('click', () => {
                if (editor.redo()) {
                    editor.enterEditMode();
                }
            });

            // Zoom buttons
            document.getElementById('btnZoomIn').addEventListener('click', () => {
                editor.zoomIn();
            });
            document.getElementById('btnZoomOut').addEventListener('click', () => {
                editor.zoomOut();
            });
            document.getElementById('btnFitData').addEventListener('click', () => {
                editor.fitToData();
            });
            document.getElementById('btnResetZoom').addEventListener('click', () => {
                editor.resetZoom();
            });

            // Range input changes
            document.getElementById('xMin').addEventListener('change', (e) => {
                editor.updateRange('x', 'min', e.target.value, e.target);
            });
            document.getElementById('xMax').addEventListener('change', (e) => {
                editor.updateRange('x', 'max', e.target.value, e.target);
            });
            document.getElementById('yMin').addEventListener('change', (e) => {
                editor.updateRange('y', 'min', e.target.value, e.target);
            });
            document.getElementById('yMax').addEventListener('change', (e) => {
                editor.updateRange('y', 'max', e.target.value, e.target);
            });

            // Listen for messages from Streamlit
            window.addEventListener('message', (event) => {
                if (event.data.type === 'streamlit:render') {
                    DebugLog.log('STREAMLIT_RENDER', 'Received render message from Streamlit');

                    const args = event.data.args;
                    editor.setConfig({
                        lines: args.lines || [],
                        xRange: args.xRange || [0, 100],
                        yRange: args.yRange || [0, 1000],
                        colors: args.colors || ["#FF6B6B", "#4ECDC4", "#45B7D1"],
                        gridSnap: args.gridSnap || null,
                        title: args.title || '',
                        xLabel: args.xLabel || '',
                        yLabel: args.yLabel || '',
                        width: args.width || 700,
                        height: args.height || 450,
                        disabled: args.disabled || false,
                        minPoints: args.minPoints || 0,
                        maxPoints: args.maxPoints || null,
                        zoomEnabled: args.zoomEnabled || false,
                        readOnly: args.readOnly || false
                    });

                    setTimeout(() => {
                        setFrameHeight(document.body.scrollHeight);
                    }, 100);
                }
            });

            setComponentReady();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
